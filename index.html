<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emulsa">
<meta name="theme-color" content="#121110">
<meta name="description" content="Câmera retrô offline: filmes, CCD, instantâneas, VHS e Super 8 revelados no seu aparelho.">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<title>Emulsa</title>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="b-flash" aria-label="Visual de flash"></button>
    <button id="b-timer" aria-label="Temporizador"></button>
    <button id="b-date" aria-label="Data impressa"></button>
    <button id="b-leak" aria-label="Vazamento de luz"></button>
    <button id="b-grid" aria-label="Grade"></button>
    <button id="b-lens" aria-label="Lente"></button>
    <button id="b-double" aria-label="Exposição dupla"></button>
    <span class="flex"></span>
    <button id="b-info" aria-label="Sobre"></button>
  </header>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="grid" hidden></div>
    <div id="count" hidden></div>
    <div id="rec" hidden><i></i><span>00:00</span></div>
    <div id="toast" hidden></div>
    <div id="curtain"></div>
    <div id="start" hidden>
      <p id="start-msg">O Emulsa revela as fotos no seu aparelho. Nada sai do seu iPhone.</p>
      <button id="b-start" class="pill sel">Ligar a câmera</button>
    </div>
  </main>
  <section id="tools">
    <button id="b-ev" class="txt" aria-label="Exposição">±0</button>
    <input id="ev" type="range" min="-2" max="2" step="0.1" value="0" hidden aria-label="Exposição">
  </section>
  <div id="picker" role="listbox" aria-label="Câmeras"></div>
  <nav id="modes"><button data-mode="photo" class="on">FOTO</button><button data-mode="video">VÍDEO</button></nav>
  <footer id="bottom">
    <button id="b-gallery" aria-label="Galeria"><img id="thumb" alt=""></button>
    <button id="shutter" aria-label="Fotografar"><span></span></button>
    <button id="b-flip" aria-label="Trocar câmera"></button>
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <header><button id="sheet-close" aria-label="Fechar"></button><h2 id="sheet-title"></h2><span class="flex"></span><span id="sheet-actions"></span></header>
  <div id="sheet-body"></div>
</div>

<input id="file" type="file" accept="image/*" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
